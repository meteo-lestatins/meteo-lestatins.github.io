name: Mettre à jour le site
run-name: Mise à jour ${{ inputs.request_id || github.run_number }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identifiant de la demande de l’administration.
        required: false
permissions:
  contents: read
  actions: write
concurrency:
  group: update-site
  cancel-in-progress: false
jobs:
  update:
    if: github.repository != 'nicklausFR/bulletin-local-meteo-france' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Autorisation de mise à jour
        env:
          UPDATE_TOKEN: ${{ secrets.BULLETIN_UPDATE_TOKEN }}
        run: |
          if [ -z "$UPDATE_TOKEN" ]; then
            echo "::error::Configurer BULLETIN_UPDATE_TOKEN (Contents et Workflows en écriture) dans les secrets du dépôt."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BULLETIN_UPDATE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer le code commun
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/update-source.mjs
          git push origin HEAD:"$SITE_BRANCH"
        env:
          SITE_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Demander la publication de la version installée
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_BRANCH: ${{ github.event.repository.default_branch }}
          REQUEST_ID: ${{ inputs.request_id || github.run_number }}
        run: gh workflow run weather.yml --ref "$SITE_BRANCH" -f group=cached -f publish=true -f request_id="$REQUEST_ID"
