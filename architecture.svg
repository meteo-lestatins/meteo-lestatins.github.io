<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" role="img" aria-labelledby="title description">
  <title id="title">Architecture et calculs de Météo les Tatins</title>
  <desc id="description">Les API météorologiques alimentent un serveur personnel 1&amp;1. Le serveur Node.js acquiert et décode les données, réalise les calculs de nowcasting, conserve les résultats dans son cache, puis fournit au site GitHub Pages un JSON prêt à afficher.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#337f9f"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#244e61" flood-opacity=".13"/>
    </filter>
    <style>
      .box{fill:#fff;stroke:#b8d2de;stroke-width:2;filter:url(#shadow)}
      .host{fill:#f2f9fc;stroke:#4b9dbd;stroke-width:2}.api{fill:#fff8e8;stroke:#dfa83f}.node{fill:#e9f6fb;stroke:#4b9dbd}.process{fill:#f2f3fb;stroke:#7b83bd}.compute{fill:#fff5ed;stroke:#d58d51}.cache{fill:#eef8f3;stroke:#58a47c}
      .host-title{fill:#173f57;font:800 17px Inter,system-ui,sans-serif}.title{fill:#173f57;font:700 17px Inter,system-ui,sans-serif}.subtitle{fill:#315e74;font:700 13px Inter,system-ui,sans-serif}.detail{fill:#607783;font:500 12px Inter,system-ui,sans-serif}
      .arrow{fill:none;stroke:#337f9f;stroke-width:2.5;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}
      .label{fill:#33718c;font:700 11px Inter,system-ui,sans-serif;letter-spacing:.03em}
      .divider{stroke:#e2c6ae;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1280" height="600" rx="16" fill="#f7fafb"/>

  <text class="host-title" x="25" y="42">SOURCES EXTERNES</text>
  <g transform="translate(25 70)">
    <rect class="box api" width="205" height="78" rx="13"/>
    <text class="title" x="102.5" y="46" text-anchor="middle">Météo-France</text>
  </g>
  <g transform="translate(25 190)">
    <rect class="box api" width="205" height="78" rx="13"/>
    <text class="title" x="102.5" y="46" text-anchor="middle">EUMETSAT</text>
  </g>
  <g transform="translate(25 310)">
    <rect class="box api" width="205" height="78" rx="13"/>
    <text class="title" x="102.5" y="46" text-anchor="middle">Open-Meteo</text>
  </g>

  <g aria-label="Traitements exécutés sur le serveur personnel 1&amp;1">
    <rect class="host" x="275" y="25" width="735" height="550" rx="20"/>
    <text class="host-title" x="305" y="58">SERVEUR PERSONNEL 1&amp;1 · TRAITEMENTS NODE.JS</text>

    <g transform="translate(310 80)">
      <rect class="box node" width="300" height="100" rx="14"/>
      <text class="title" x="150" y="30" text-anchor="middle">1 · Acquisition sécurisée</text>
      <text class="detail" x="150" y="56" text-anchor="middle">Clés privées · OAuth · requêtes WCS</text>
      <text class="detail" x="150" y="78" text-anchor="middle">Radar · PIAF · modèles · foudre</text>
    </g>

    <g transform="translate(665 80)">
      <rect class="box process" width="305" height="100" rx="14"/>
      <text class="title" x="152.5" y="30" text-anchor="middle">2 · Décodage et contrôle</text>
      <text class="detail" x="152.5" y="56" text-anchor="middle">HDF5 · NetCDF4 · GeoTIFF · XML/JSON</text>
      <text class="detail" x="152.5" y="78" text-anchor="middle">Unités · coordonnées · cohérence des cycles</text>
    </g>

    <g transform="translate(310 225)">
      <rect class="box compute" width="660" height="205" rx="14"/>
      <text class="title" x="330" y="31" text-anchor="middle">3 · Calculs locaux de nowcasting</text>
      <line class="divider" x1="220" y1="52" x2="220" y2="194"/>
      <line class="divider" x1="440" y1="52" x2="440" y2="194"/>

      <text class="subtitle" x="110" y="73" text-anchor="middle">Détection radar</text>
      <text class="detail" x="110" y="99" text-anchor="middle">Extraction autour des Tatins</text>
      <text class="detail" x="110" y="121" text-anchor="middle">Composantes connexes</text>
      <text class="detail" x="110" y="143" text-anchor="middle">Centre · surface · rayon</text>
      <text class="detail" x="110" y="165" text-anchor="middle">Pluie moyenne et maximale</text>

      <text class="subtitle" x="330" y="73" text-anchor="middle">Suivi et fusion</text>
      <text class="detail" x="330" y="99" text-anchor="middle">Comparaison de deux images</text>
      <text class="detail" x="330" y="121" text-anchor="middle">Direction · vitesse</text>
      <text class="detail" x="330" y="143" text-anchor="middle">Trajectoire jusqu’à 60 min</text>
      <text class="detail" x="330" y="165" text-anchor="middle">Fusion radar + PIAF + foudre</text>
      <text class="detail" x="330" y="187" text-anchor="middle">Probabilités PE-AROME</text>

      <text class="subtitle" x="550" y="73" text-anchor="middle">Indicateurs calculés</text>
      <text class="detail" x="550" y="99" text-anchor="middle">Passage aux Tatins</text>
      <text class="detail" x="550" y="121" text-anchor="middle">Risque de pluie intense</text>
      <text class="detail" x="550" y="143" text-anchor="middle">Potentiel orageux · grêle</text>
      <text class="detail" x="550" y="165" text-anchor="middle">Heure d’arrivée</text>
      <text class="detail" x="550" y="187" text-anchor="middle">Zone d’incertitude</text>
    </g>

    <g transform="translate(310 475)">
      <rect class="box cache" width="660" height="70" rx="14"/>
      <text class="title" x="330" y="29" text-anchor="middle">4 · Cache local au serveur et API publique</text>
      <text class="detail" x="330" y="51" text-anchor="middle">Derniers résultats complets · actualisation autonome · JSON prêt à afficher</text>
    </g>

    <path class="arrow" d="M610 130H665"/>
    <path class="arrow" d="M817 180V205H640V225"/>
    <path class="arrow" d="M640 430V475"/>
  </g>

  <g transform="translate(1060 245)">
    <rect class="box" width="195" height="110" rx="14"/>
    <text class="title" x="97.5" y="39" text-anchor="middle">Site GitHub Pages</text>
    <text class="detail" x="97.5" y="67" text-anchor="middle">Affichage uniquement</text>
    <text class="detail" x="97.5" y="88" text-anchor="middle">HTML · CSS · JavaScript</text>
  </g>

  <path class="arrow both" d="M230 109C265 109 275 130 310 130"/>
  <path class="arrow both" d="M230 229C265 229 275 150 310 150"/>
  <path class="arrow both" d="M230 349C265 349 275 170 310 170"/>
  <text class="label" x="252" y="92" text-anchor="middle">requêtes / données</text>

  <path class="arrow both" d="M970 510C1020 510 1020 300 1060 300"/>
  <text class="label" x="1035" y="438" text-anchor="middle">HTTPS · JSON calculé</text>
</svg>
