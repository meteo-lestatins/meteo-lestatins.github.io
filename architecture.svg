<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title description">
  <title id="title">Architecture de Météo les Tatins</title>
  <desc id="description">Le site statique échange avec un serveur personnel 1&amp;1. Sur ce serveur, Node.js interroge les API météorologiques, contrôle leurs données et les conserve dans un cache local avant de renvoyer un JSON au site.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#337f9f"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#244e61" flood-opacity=".13"/>
    </filter>
    <style>
      .box{fill:#fff;stroke:#b8d2de;stroke-width:2;filter:url(#shadow)}
      .host{fill:#f2f9fc;stroke:#4b9dbd;stroke-width:2}.server{fill:#e9f6fb;stroke:#4b9dbd}.api{fill:#fff8e8;stroke:#dfa83f}.cache{fill:#eef8f3;stroke:#58a47c}
      .host-title{fill:#173f57;font:800 17px Inter,system-ui,sans-serif}.title{fill:#173f57;font:700 18px Inter,system-ui,sans-serif}.detail{fill:#607783;font:500 13px Inter,system-ui,sans-serif}
      .arrow{fill:none;stroke:#337f9f;stroke-width:2.5;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}
      .label{fill:#33718c;font:700 11px Inter,system-ui,sans-serif;letter-spacing:.04em}
    </style>
  </defs>

  <rect width="1100" height="420" rx="16" fill="#f7fafb"/>

  <g transform="translate(25 158)">
    <rect class="box" width="220" height="105" rx="14"/>
    <text class="title" x="110" y="39" text-anchor="middle">Site GitHub Pages</text>
    <text class="detail" x="110" y="67" text-anchor="middle">HTML · CSS · JavaScript</text>
  </g>

  <g aria-label="Serveur personnel 1&amp;1">
    <rect class="host" x="300" y="28" width="475" height="364" rx="20"/>
    <text class="host-title" x="325" y="60">SERVEUR PERSONNEL 1&amp;1</text>

    <g transform="translate(330 102)">
      <rect class="box server" width="190" height="105" rx="14"/>
      <text class="title" x="95" y="39" text-anchor="middle">Serveur Node.js</text>
      <text class="detail" x="95" y="67" text-anchor="middle">API sécurisée</text>
    </g>

    <g transform="translate(545 92)">
      <rect class="box cache" width="200" height="125" rx="14"/>
      <text class="title" x="100" y="34" text-anchor="middle">Contrôle des données</text>
      <text class="detail" x="100" y="61" text-anchor="middle">Traitements locaux</text>
      <text class="detail" x="100" y="84" text-anchor="middle">Cache sur le serveur</text>
      <text class="detail" x="100" y="107" text-anchor="middle">JSON prêt à afficher</text>
    </g>

    <path class="arrow both" d="M520 154H545"/>
    <path class="arrow" d="M645 217V315H425V207"/>
    <text class="label" x="535" y="340" text-anchor="middle">réponse JSON issue du cache serveur</text>
  </g>

  <g transform="translate(865 39)">
    <rect class="box api" width="205" height="72" rx="13"/>
    <text class="title" x="102.5" y="43" text-anchor="middle">Météo-France</text>
  </g>
  <g transform="translate(865 174)">
    <rect class="box api" width="205" height="72" rx="13"/>
    <text class="title" x="102.5" y="43" text-anchor="middle">EUMETSAT</text>
  </g>
  <g transform="translate(865 309)">
    <rect class="box api" width="205" height="72" rx="13"/>
    <text class="title" x="102.5" y="43" text-anchor="middle">Open-Meteo</text>
  </g>

  <path class="arrow both" d="M245 191H330"/>
  <text class="label" x="287" y="179" text-anchor="middle">HTTPS</text>

  <path class="arrow both" d="M745 122C805 122 810 75 865 75"/>
  <path class="arrow both" d="M745 154C800 154 810 210 865 210"/>
  <path class="arrow both" d="M745 187C800 187 810 345 865 345"/>
</svg>
