<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title description">
  <title id="title">Architecture de Météo les Tatins</title>
  <desc id="description">Le site statique échange avec un serveur Node.js qui interroge les API Météo-France, EUMETSAT et Open-Meteo, puis contrôle et met en cache leurs données.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#337f9f"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#244e61" flood-opacity=".13"/>
    </filter>
    <style>
      .box{fill:#fff;stroke:#b8d2de;stroke-width:2;filter:url(#shadow)}
      .server{fill:#e9f6fb;stroke:#4b9dbd}.api{fill:#fff8e8;stroke:#dfa83f}.cache{fill:#eef8f3;stroke:#58a47c}
      .title{fill:#173f57;font:700 18px Inter,system-ui,sans-serif}.detail{fill:#607783;font:500 13px Inter,system-ui,sans-serif}
      .arrow{fill:none;stroke:#337f9f;stroke-width:2.5;marker-end:url(#arrow)}
      .return{stroke-dasharray:7 6}.label{fill:#33718c;font:700 11px Inter,system-ui,sans-serif;letter-spacing:.04em}
    </style>
  </defs>

  <rect width="1100" height="390" rx="16" fill="#f7fafb"/>

  <g transform="translate(28 135)">
    <rect class="box" width="235" height="105" rx="14"/>
    <text class="title" x="117.5" y="39" text-anchor="middle">Site GitHub Pages</text>
    <text class="detail" x="117.5" y="67" text-anchor="middle">HTML · CSS · JavaScript</text>
  </g>

  <g transform="translate(335 135)">
    <rect class="box server" width="190" height="105" rx="14"/>
    <text class="title" x="95" y="39" text-anchor="middle">Serveur Node.js</text>
    <text class="detail" x="95" y="67" text-anchor="middle">API sécurisée</text>
  </g>

  <g transform="translate(615 30)">
    <rect class="box api" width="190" height="72" rx="13"/>
    <text class="title" x="95" y="43" text-anchor="middle">Météo-France</text>
  </g>
  <g transform="translate(615 151)">
    <rect class="box api" width="190" height="72" rx="13"/>
    <text class="title" x="95" y="43" text-anchor="middle">EUMETSAT</text>
  </g>
  <g transform="translate(615 272)">
    <rect class="box api" width="190" height="72" rx="13"/>
    <text class="title" x="95" y="43" text-anchor="middle">Open-Meteo</text>
  </g>

  <g transform="translate(880 135)">
    <rect class="box cache" width="190" height="105" rx="14"/>
    <text class="title" x="95" y="35" text-anchor="middle">Contrôle et cache</text>
    <text class="detail" x="95" y="62" text-anchor="middle">Traitements locaux</text>
    <text class="detail" x="95" y="82" text-anchor="middle">JSON prêt à afficher</text>
  </g>

  <path class="arrow" d="M263 170H335"/>
  <path class="arrow" d="M335 208H263"/>
  <text class="label" x="299" y="157" text-anchor="middle">HTTPS</text>

  <path class="arrow" d="M525 170C560 170 570 66 615 66"/>
  <path class="arrow" d="M525 187H615"/>
  <path class="arrow" d="M525 205C560 205 570 308 615 308"/>

  <path class="arrow" d="M805 66C850 66 845 166 880 166"/>
  <path class="arrow" d="M805 187H880"/>
  <path class="arrow" d="M805 308C850 308 845 209 880 209"/>

  <path class="arrow return" d="M975 240C975 366 430 375 430 240"/>
  <text class="label" x="704" y="371" text-anchor="middle">données contrôlées et mises en cache</text>
</svg>
