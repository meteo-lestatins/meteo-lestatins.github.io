<title>Replay nowcasting radar</title>
<style>

  input[type=range]{width:100%}.readout{font-weight:760;white-space:nowrap}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
  .stat{border:1px solid var(--line);border-radius:7px;padding:8px;background:#f8fcfd}.label{color:var(--muted);font-size:12px}.value{font-size:20px;font-weight:780}
  .cell-list{margin-top:10px;display:grid;gap:8px}.cell-row{border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff}.cell-row strong{color:var(--orange)}
  .axis,.grid,.range{stroke:var(--line)}.grid{opacity:.65}.prob{fill:none;stroke:var(--blue);stroke-width:3}.dot{fill:#fff;stroke:var(--blue);stroke-width:2}.active-dot{fill:var(--red);stroke:#fff;stroke-width:3}
  .map-bg{fill:#eaf6fa;stroke:var(--line)}.range{fill:none;stroke-dasharray:4 5}.tatins{fill:var(--red);stroke:#fff;stroke-width:3}.cell{fill:var(--orange);fill-opacity:.22;stroke:var(--orange);stroke-width:2}.track{fill:none;stroke:var(--blue2);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(255,255,255,.95))}.direction{fill:none;stroke:var(--blue2);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(255,255,255,.95))}.cone{fill:var(--blue);stroke:none;filter:blur(14px)}.caption{fill:var(--ink);font-weight:720}.small{fill:var(--muted);font-size:11px}
  @media (max-width:880px){.stage{grid-template-columns:1fr}.controls{grid-template-columns:auto 1fr auto}.readout{grid-column:1/-1}.stats{grid-template-columns:1fr}}

function scaleForFrame(frame){
  if (frame.cells.some(cell => Math.max(0, Math.hypot(cell.eastKm, cell.northKm) - cell.radiusKm) <= 20)) return 760 / 44;
  let maxKm = 60;
  frame.cells.forEach(cell => {
    maxKm = Math.max(maxKm, Math.hypot(cell.eastKm, cell.northKm) + cell.radiusKm);
    cell.track.forEach(point => {
      maxKm = Math.max(maxKm, Math.hypot(point.eastKm, point.northKm) + Math.max(0, point.uncertaintyKm || 0));
    });
  });
  return 760 / Math.min(340, Math.max(150, maxKm * 2.25));
}
function project(point, km){
  return [380 + point.eastKm * km, 380 - point.northKm * km];

  const km = scaleForFrame(frame);
  const showSixty = 60 * km < 360;
  map.innerHTML = '<rect class="map-bg" x="0" y="0" width="760" height="760"></rect><circle class="range" cx="380" cy="380" r="'+(20*km)+'"></circle>'+(showSixty ? '<circle class="range" cx="380" cy="380" r="'+(60*km)+'"></circle>' : '')+'<line class="grid" x1="380" y1="18" x2="380" y2="742"></line><line class="grid" x1="18" y1="380" x2="742" y2="380"></line><circle class="tatins" cx="380" cy="380" r="8"></circle><text class="caption" x="396" y="374">Les Tatins</text>';
  frame.cells.slice().reverse().forEach((cell, cellIndex) => {
    const pts = cell.track.map(point => project(point, km));
    const isPrimary = cell === frame.cells[0];
    if (isPrimary && pts.length > 1) {
      const start = pts[0], end = pts[pts.length - 1];
      const dx = end[0]-start[0], dy=end[1]-start[1], len=Math.max(1,Math.hypot(dx,dy));
      const ux = dx / len, uy = dy / len;
      const width = 14 + Math.max(0, Math.min(60, cell.confidence)) * .35 + cell.passage * .25;
      const opacity = Math.max(.18, Math.min(.58, cell.passage / 175 + cell.confidence / 300));
      const startRadius = Math.max(7, cell.radiusKm*km);
      const edgeStart = [start[0] + ux * (startRadius + 5), start[1] + uy * (startRadius + 5)];
      const startHalfWidth = startRadius;
      const visiblePts = [edgeStart, ...pts.slice(1)];
      const conePts = [start, ...pts.slice(1)];
      const gradientId = "cone-gradient-" + index + "-" + cellIndex;
      const widths = conePts.map((p,i) => i ? Math.max(5, cell.track[i].uncertaintyKm*km) : startHalfWidth);
      const left = [], right = [];
      conePts.forEach((p,i) => {
        const next = conePts[Math.min(conePts.length - 1, i + 1)];
        const previous = conePts[Math.max(0, i - 1)];
        const sx = next[0] - previous[0], sy = next[1] - previous[1], sl = Math.max(1, Math.hypot(sx, sy));
        const normalX = -sy / sl, normalY = sx / sl;
        left.push([p[0] + normalX * widths[i], p[1] + normalY * widths[i]]);
        right.push([p[0] - normalX * widths[i], p[1] - normalY * widths[i]]);
      });
      const conePath = left.concat(right.reverse()).map((p,i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ") + "Z";
      const gradient = '<defs><linearGradient id="'+gradientId+'" gradientUnits="userSpaceOnUse" x1="'+edgeStart[0].toFixed(1)+'" y1="'+edgeStart[1].toFixed(1)+'" x2="'+end[0].toFixed(1)+'" y2="'+end[1].toFixed(1)+'"><stop offset="0" stop-color="#1688bd" stop-opacity="'+opacity.toFixed(3)+'"></stop><stop offset=".55" stop-color="#1688bd" stop-opacity="'+(opacity*.68).toFixed(3)+'"></stop><stop offset="1" stop-color="#1688bd" stop-opacity="0"></stop></linearGradient></defs>';
      const chevron = offset => {
        const cx = edgeStart[0] + ux * offset, cy = edgeStart[1] + uy * offset;
        const bx = cx - ux * 8, by = cy - uy * 8;
        const normalX = -uy, normalY = ux;
        return '<path class="direction" d="M'+(bx+normalX*5).toFixed(1)+' '+(by+normalY*5).toFixed(1)+'L'+cx.toFixed(1)+' '+cy.toFixed(1)+'L'+(bx-normalX*5).toFixed(1)+' '+(by-normalY*5).toFixed(1)+'"></path>';
      };
      map.insertAdjacentHTML("beforeend", gradient + '<path class="cone" style="fill:url(#'+gradientId+')" d="'+conePath+'"></path>' + chevron(18));
    }
    const c = project(cell, km);
    map.insertAdjacentHTML("beforeend", '<circle class="cell" cx="'+c[0]+'" cy="'+c[1]+'" r="'+Math.max(7, cell.radiusKm*km)+'"><title>'+cell.id+' '+cell.passage+'%</title></circle><text class="caption" x="'+(c[0]+10)+'" y="'+(c[1]-10)+'">'+cell.id+'</text>');
  });
}
function render(){
  const f = frames[index] || frames[0];
  slider.value = String(index);
  document.getElementById("readout").textContent = f.time + " UTC";
  document.getElementById("passage").textContent = f.passage + "%";
  document.getElementById("eta").textContent = f.eta == null ? "-" : (f.cells[0]?.etaBasis === "envelope" ? "possible " : "") + f.eta + " min";
  document.getElementById("edge").textContent = f.edgeKm == null ? "-" : f.edgeKm + " km";
  document.getElementById("score").textContent = f.score + "/100";
  document.getElementById("cells").innerHTML = f.cells.map(c => '<div class="cell-row"><strong>'+c.id+'</strong> passage '+c.passage+'% · bord '+c.edgeKm+' km · ETA '+(c.eta==null?'-':(c.etaBasis==="envelope"?"possible ":"")+c.eta+' min')+'<br><span class="label">'+c.source+' · conf '+c.confidence+'% · max '+c.maximum+' mm/h</span></div>').join("");
  drawChart();
  chart.insertAdjacentHTML("beforeend", '<circle class="active-dot" cx="'+x(index)+'" cy="'+y(f.passage)+'" r="7"></circle>');
  drawMap(f);
}
function stop(){ if(timer) clearInterval(timer); timer=null; playButton.textContent="Lecture"; }
playButton.addEventListener("click",()=>{ if(timer){ stop(); return; } playButton.textContent="Pause"; timer=setInterval(()=>{ index = (index + 1) % frames.length; render(); }, 650); });
document.getElementById("prev").addEventListener("click",()=>{ stop(); index=Math.max(0,index-1); render(); });
document.getElementById("next").addEventListener("click",()=>{ stop(); index=Math.min(frames.length-1,index+1); render(); });
slider.addEventListener("input",()=>{ stop(); index=Number(slider.value); render(); });
drawChart(); render();
</script>
</body>
