<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay nowcasting radar</title>
<style>
  :root{--bg:#f6fbfd;--ink:#17384d;--muted:#5e7686;--line:#cfe0e8;--blue:#1688bd;--blue2:#0f6f97;--orange:#f17822;--red:#d84b37;--yellow:#f7b733}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{max-width:1180px;margin:0 auto;padding:18px}
  header{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
  h1{font-size:20px;margin:0;font-weight:760}.meta{color:var(--muted);font-size:13px}
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
  .panel{border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px}
  svg{display:block;width:100%;height:auto}.chart{height:190px}.map{aspect-ratio:1/1}
  .controls{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;margin:12px 0}
  button{border:1px solid #a9ccd9;background:#e8f5fa;color:var(--ink);border-radius:7px;padding:8px 12px;font-weight:720;cursor:pointer}
  input[type=range]{width:100%}.readout{font-weight:760;white-space:nowrap}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
  .stat{border:1px solid var(--line);border-radius:7px;padding:8px;background:#f8fcfd}.label{color:var(--muted);font-size:12px}.value{font-size:20px;font-weight:780}
  .cell-list{margin-top:10px;display:grid;gap:8px}.cell-row{border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff}.cell-row strong{color:var(--orange)}
  .axis,.grid,.range{stroke:var(--line)}.grid{opacity:.65}.prob{fill:none;stroke:var(--blue);stroke-width:3}.dot{fill:#fff;stroke:var(--blue);stroke-width:2}.active-dot{fill:var(--red);stroke:#fff;stroke-width:3}
  .map-bg{fill:#eaf6fa;stroke:var(--line)}.range{fill:none;stroke-dasharray:4 5}.tatins{fill:var(--red);stroke:#fff;stroke-width:3}.cell{fill:var(--orange);fill-opacity:.22;stroke:var(--orange);stroke-width:2}.track{fill:none;stroke:var(--blue2);stroke-width:3}.cone{fill:var(--blue);stroke:var(--blue);stroke-opacity:.6}.uncertainty{fill:none;stroke:var(--blue);stroke-opacity:.25;stroke-dasharray:5 4}.caption{fill:var(--ink);font-weight:720}.small{fill:var(--muted);font-size:11px}
  @media (max-width:880px){.stage{grid-template-columns:1fr}.controls{grid-template-columns:auto 1fr auto}.readout{grid-column:1/-1}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>

  <div class="stage">

        <div class="stat"><div class="label">Score risque</div><div class="value" id="score"></div></div>
      </div>
      <div class="cell-list" id="cells"></div>
    </aside>
  </div>
</main>

const slider = document.getElementById("slider");
const playButton = document.getElementById("play");
const chart = document.getElementById("chart");
const map = document.getElementById("map");
let index = 0;
let timer = null;
slider.max = String(Math.max(0, frames.length - 1));
const chartBox = {x:46,y:18,w:1000,h:130};
const x = i => chartBox.x + i / Math.max(1, frames.length - 1) * chartBox.w;
const y = p => chartBox.y + chartBox.h - p / 100 * chartBox.h;
function line(points){return points.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")}
function drawChart(){
  chart.innerHTML = "";
  [0,25,50,75,100].forEach(v => chart.insertAdjacentHTML("beforeend", '<line class="grid" x1="'+chartBox.x+'" y1="'+y(v)+'" x2="'+(chartBox.x+chartBox.w)+'" y2="'+y(v)+'"></line><text x="38" y="'+(y(v)+4)+'" text-anchor="end">'+v+'%</text>'));
  const path = frames.map((f,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(f.passage).toFixed(1)).join(" ");
  chart.insertAdjacentHTML("beforeend", '<path class="prob" d="'+path+'"></path>');
  frames.forEach((f,i)=>chart.insertAdjacentHTML("beforeend", '<circle class="dot" cx="'+x(i)+'" cy="'+y(f.passage)+'" r="3"><title>'+f.time+' '+f.passage+'%</title></circle>'));
  [0,Math.floor(frames.length*.25),Math.floor(frames.length*.5),Math.floor(frames.length*.75),frames.length-1].forEach(i=>chart.insertAdjacentHTML("beforeend", '<text class="small" x="'+x(i)+'" y="176" text-anchor="middle">'+frames[i].time+'</text>'));
}
function project(point){
  const km = 760 / 150;
  return [380 + point.eastKm * km, 380 - point.northKm * km];
}
function drawMap(frame){
  map.innerHTML = '<rect class="map-bg" x="0" y="0" width="760" height="760"></rect><circle class="range" cx="380" cy="380" r="'+(20*760/150)+'"></circle><circle class="range" cx="380" cy="380" r="'+(60*760/150)+'"></circle><line class="grid" x1="380" y1="18" x2="380" y2="742"></line><line class="grid" x1="18" y1="380" x2="742" y2="380"></line><circle class="tatins" cx="380" cy="380" r="8"></circle><text class="caption" x="396" y="374">Les Tatins</text>';
  frame.cells.slice().reverse().forEach(cell => {
    const pts = cell.track.map(project);
    if (pts.length > 1) {
      const start = pts[0], end = pts[pts.length - 1];
      const dx = end[0]-start[0], dy=end[1]-start[1], len=Math.max(1,Math.hypot(dx,dy));
      const nx=-dy/len, ny=dx/len;
      const width = 14 + Math.max(0, Math.min(60, cell.confidence)) * .35 + cell.passage * .25;
      const opacity = Math.max(.08, Math.min(.35, cell.passage / 250 + cell.confidence / 450));
      const cone = [[start[0],start[1]],[end[0]+nx*width,end[1]+ny*width],[end[0]-nx*width,end[1]-ny*width]].map(p=>p.join(",")).join(" ");
      map.insertAdjacentHTML("beforeend", '<polygon class="cone" style="opacity:'+opacity.toFixed(2)+'" points="'+cone+'"></polygon><path class="track" d="'+line(pts)+'"></path>');
      pts.forEach((p,i)=>map.insertAdjacentHTML("beforeend", '<circle class="uncertainty" cx="'+p[0]+'" cy="'+p[1]+'" r="'+Math.max(5, cell.track[i].uncertaintyKm*760/150)+'"></circle>'));
    }
    const c = project(cell);
    map.insertAdjacentHTML("beforeend", '<circle class="cell" cx="'+c[0]+'" cy="'+c[1]+'" r="'+Math.max(7, cell.radiusKm*760/150)+'"><title>'+cell.id+' '+cell.passage+'%</title></circle><text class="caption" x="'+(c[0]+10)+'" y="'+(c[1]-10)+'">'+cell.id+'</text>');
  });
}
function render(){
  const f = frames[index] || frames[0];
  slider.value = String(index);
  document.getElementById("readout").textContent = f.time + " UTC";
  document.getElementById("passage").textContent = f.passage + "%";
  document.getElementById("eta").textContent = f.eta == null ? "-" : f.eta + " min";
  document.getElementById("edge").textContent = f.edgeKm == null ? "-" : f.edgeKm + " km";
  document.getElementById("score").textContent = f.score + "/100";
  document.getElementById("cells").innerHTML = f.cells.map(c => '<div class="cell-row"><strong>'+c.id+'</strong> passage '+c.passage+'% · bord '+c.edgeKm+' km · ETA '+(c.eta==null?'-':c.eta+' min')+'<br><span class="label">'+c.source+' · conf '+c.confidence+'% · max '+c.maximum+' mm/h</span></div>').join("");
  drawChart();
  chart.insertAdjacentHTML("beforeend", '<circle class="active-dot" cx="'+x(index)+'" cy="'+y(f.passage)+'" r="7"></circle>');
  drawMap(f);
}
function stop(){ if(timer) clearInterval(timer); timer=null; playButton.textContent="Lecture"; }
playButton.addEventListener("click",()=>{ if(timer){ stop(); return; } playButton.textContent="Pause"; timer=setInterval(()=>{ index = (index + 1) % frames.length; render(); }, 650); });
document.getElementById("prev").addEventListener("click",()=>{ stop(); index=Math.max(0,index-1); render(); });
document.getElementById("next").addEventListener("click",()=>{ stop(); index=Math.min(frames.length-1,index+1); render(); });
slider.addEventListener("input",()=>{ stop(); index=Number(slider.value); render(); });
drawChart(); render();
</script>
