<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Flux de traitement de Météo les Tatins</title>
  <desc id="description">Le site demande un résultat au serveur 1&amp;1. Le serveur interroge les API météorologiques, réceptionne et contrôle leurs données, effectue les calculs de nowcasting, met les résultats en cache et renvoie un JSON au site.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#337f9f"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#244e61" flood-opacity=".13"/>
    </filter>
    <style>
      .box{fill:#fff;stroke:#b8d2de;stroke-width:2;filter:url(#shadow)}
      .host{fill:#f2f9fc;stroke:#4b9dbd;stroke-width:2}.api{fill:#fff8e8;stroke:#dfa83f}.request{fill:#e9f6fb;stroke:#4b9dbd}.receive{fill:#f2f3fb;stroke:#7b83bd}.compute{fill:#fff5ed;stroke:#d58d51}.cache{fill:#eef8f3;stroke:#58a47c}
      .host-title{fill:#173f57;font:800 17px Inter,system-ui,sans-serif}.title{fill:#173f57;font:700 17px Inter,system-ui,sans-serif}.detail{fill:#607783;font:500 12px Inter,system-ui,sans-serif}
      .arrow{fill:none;stroke:#337f9f;stroke-width:2.5;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}
      .label{fill:#33718c;font:700 11px Inter,system-ui,sans-serif;letter-spacing:.03em}
    </style>
  </defs>

  <rect width="1200" height="520" rx="16" fill="#f7fafb"/>

  <text class="host-title" x="22" y="39">API MÉTÉOROLOGIQUES</text>
  <g transform="translate(22 70)">
    <rect class="box api" width="200" height="72" rx="13"/>
    <text class="title" x="100" y="43" text-anchor="middle">Météo-France</text>
  </g>
  <g transform="translate(22 185)">
    <rect class="box api" width="200" height="72" rx="13"/>
    <text class="title" x="100" y="43" text-anchor="middle">EUMETSAT</text>
  </g>
  <g transform="translate(22 300)">
    <rect class="box api" width="200" height="72" rx="13"/>
    <text class="title" x="100" y="43" text-anchor="middle">Open-Meteo</text>
  </g>

  <g aria-label="Traitements exécutés sur le serveur personnel 1&amp;1">
    <rect class="host" x="275" y="25" width="645" height="470" rx="20"/>
    <text class="host-title" x="305" y="58">SERVEUR 1&amp;1 · NODE.JS</text>

    <g transform="translate(310 80)">
      <rect class="box request" width="250" height="92" rx="14"/>
      <text class="title" x="125" y="33" text-anchor="middle">1 · Demande des données</text>
      <text class="detail" x="125" y="59" text-anchor="middle">Requêtes authentifiées</text>
      <text class="detail" x="125" y="78" text-anchor="middle">Clés privées conservées ici</text>
    </g>

    <g transform="translate(310 250)">
      <rect class="box receive" width="260" height="92" rx="14"/>
      <text class="title" x="130" y="33" text-anchor="middle">2 · Réception et contrôle</text>
      <text class="detail" x="130" y="59" text-anchor="middle">Décodage · unités · coordonnées</text>
      <text class="detail" x="130" y="78" text-anchor="middle">Cohérence et données exploitables</text>
    </g>

    <g transform="translate(625 225)">
      <rect class="box compute" width="260" height="142" rx="14"/>
      <text class="title" x="130" y="31" text-anchor="middle">3 · Calculs</text>
      <text class="detail" x="130" y="57" text-anchor="middle">Détection et suivi des cellules</text>
      <text class="detail" x="130" y="78" text-anchor="middle">Trajectoires · fusion des sources</text>
      <text class="detail" x="130" y="99" text-anchor="middle">Passage · pluie · orage · grêle</text>
      <text class="detail" x="130" y="120" text-anchor="middle">Heure d’arrivée · incertitude</text>
    </g>

    <g transform="translate(625 410)">
      <rect class="box cache" width="260" height="62" rx="14"/>
      <text class="title" x="130" y="27" text-anchor="middle">4 · Cache et JSON</text>
      <text class="detail" x="130" y="48" text-anchor="middle">Résultats prêts à afficher</text>
    </g>

    <path class="arrow" d="M570 296H625"/>
    <path class="arrow" d="M755 367V410"/>
    <path class="arrow" d="M435 172V250"/>
  </g>

  <g transform="translate(980 205)">
    <rect class="box" width="195" height="110" rx="14"/>
    <text class="title" x="97.5" y="38" text-anchor="middle">meteo-lestatins</text>
    <text class="title" x="97.5" y="59" text-anchor="middle">.github.io</text>
    <text class="detail" x="97.5" y="87" text-anchor="middle">Affichage dans le navigateur</text>
  </g>

  <path class="arrow both" d="M310 105C270 105 260 106 222 106"/>
  <path class="arrow both" d="M310 126C260 126 260 221 222 221"/>
  <path class="arrow both" d="M310 147C260 147 260 336 222 336"/>
  <text class="label" x="258" y="91" text-anchor="middle">requêtes / données</text>

  <path class="arrow" d="M885 441C950 441 940 295 980 295"/>
  <text class="label" x="948" y="408" text-anchor="middle">JSON calculé</text>
</svg>
