<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title description">
  <title id="title">Flux technique de Météo les Tatins</title>
  <desc id="description">Les API Météo-France, EUMETSAT et Open-Meteo sont regroupées verticalement à gauche. Elles échangent avec le serveur 1&amp;1, qui demande, vérifie et traite les données avant de produire un JSON mis en cache. Le site public échange ensuite avec le serveur.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#397f9e"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#244e61" flood-opacity=".12"/>
    </filter>
    <style>
      .frame{stroke-width:2.5}.api-frame{fill:#fffdf7;stroke:#e2bb58}.server-frame{fill:#f3f9fb;stroke:#55a3c1}
      .box{stroke-width:2;filter:url(#shadow)}.source{fill:#fff8e8;stroke:#d9a12f}.server{fill:#eaf5f9;stroke:#4b9dbd}.output{fill:#eaf7f0;stroke:#55a378}.site{fill:#fff;stroke:#9dbdca}
      .frame-title{fill:#173f57;font:700 17px Inter,system-ui,sans-serif}.node-title{fill:#173f57;font:600 14px Inter,system-ui,sans-serif}
      .arrow{fill:none;stroke:#397f9e;stroke-width:3;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}
      .edge-label{fill:#33718c;font:600 10.5px Inter,system-ui,sans-serif}
    </style>
  </defs>

  <rect width="1120" height="620" rx="18" fill="#f7fafb"/>

  <g aria-label="APIs">
    <rect class="frame api-frame" x="25" y="25" width="265" height="570" rx="20"/>
    <text class="frame-title" x="157.5" y="62" text-anchor="middle">APIs</text>

    <g transform="translate(55 105)">
      <rect class="box source" width="205" height="82" rx="14"/>
      <text class="node-title" x="102.5" y="49" text-anchor="middle">Météo-France</text>
    </g>
    <g transform="translate(55 265)">
      <rect class="box source" width="205" height="82" rx="14"/>
      <text class="node-title" x="102.5" y="49" text-anchor="middle">EUMETSAT</text>
    </g>
    <g transform="translate(55 425)">
      <rect class="box source" width="205" height="82" rx="14"/>
      <text class="node-title" x="102.5" y="49" text-anchor="middle">Open-Meteo</text>
    </g>
  </g>

  <g aria-label="Serveur 1&amp;1">
    <rect class="frame server-frame" x="390" y="25" width="400" height="570" rx="20"/>
    <text class="frame-title" x="590" y="62" text-anchor="middle">Serveur 1&amp;1</text>

    <g transform="translate(430 90)">
      <rect class="box server" width="320" height="78" rx="14"/>
      <text class="node-title" x="160" y="47" text-anchor="middle">Demande des données</text>
    </g>
    <g transform="translate(430 205)">
      <rect class="box server" width="320" height="78" rx="14"/>
      <text class="node-title" x="160" y="47" text-anchor="middle">Réception et vérification</text>
    </g>
    <g transform="translate(430 320)">
      <rect class="box server" width="320" height="78" rx="14"/>
      <text class="node-title" x="160" y="47" text-anchor="middle">Traitement des données</text>
    </g>
    <g transform="translate(430 435)">
      <rect class="box output" width="320" height="78" rx="14"/>
      <text class="node-title" x="160" y="47" text-anchor="middle">Cache et création du JSON</text>
    </g>

    <path class="arrow" d="M590 168V205"/>
    <path class="arrow" d="M590 283V320"/>
    <path class="arrow" d="M590 398V435"/>
  </g>

  <g transform="translate(875 250)">
    <rect class="box site" width="220" height="120" rx="15"/>
    <text class="node-title" x="110" y="52" text-anchor="middle">meteo-lestatins</text>
    <text class="node-title" x="110" y="78" text-anchor="middle">.github.io</text>
  </g>

  <path class="arrow both" d="M290 310H390"/>
  <text class="edge-label" x="340" y="288" text-anchor="middle">Requêtes</text>
  <text class="edge-label" x="340" y="339" text-anchor="middle">Données</text>

  <path class="arrow both" d="M790 310H875"/>
  <text class="edge-label" x="832.5" y="288" text-anchor="middle">HTTPS</text>
  <text class="edge-label" x="832.5" y="339" text-anchor="middle">JSON</text>
</svg>
